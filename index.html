<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, initial-scale=1.0">
    <title>Xurya Manufacture</title>
    <link rel="stylesheet" href="./css/style.css">

</head>

<body>

    <header>
    <div class="container">
        <div id="logo">
            <img src="./assets/images/logo.png" alt="" />
            <span>Xurya</span>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <button type="button" class="btn btn-outline">Login</button>
            <button type="button" class="btn btn-primary">Get in touch</button>
        </div>
    </div>
</header>
<section class="hero">
    <div class="hero-inner">
        <div class="hero-text">
             <p class="tagline">#1 Energy provider in the world</p>
             <h1>New Energy <br> for the Future</h1>
        </div>
    <div class="hero-actions">
        <a href="#" class="hero-link">Get in touch <span>↗</span></a>
        <a href="#" class="hero-link">Our services <span>↗</span></a>
    </div>
    
    <div class="glass-card">
        <div class="glass-card-media">
            <img src="assets/images/onHero_card.png" alt="Wind turbine project" class="glass-card-img">
            <button class="dots-btn" aria-label="More options">
                <span></span><span></span><span></span>
            </button>
        </div>
    <div class="glass-card-bottom">
        <span class="arrow-circle">↗</span>
        <p>Discover Our <br> Recent Project</p>
    </div>
</div>
<section class="cards">
    <div class="card">
        <h2>6 mil</h2>
        <span class="card_paragraph"><p>The company's <br> annual net income </p></span>
    </div>
    <div class="card">
        <h2>315</h2>
        <span class="card_paragraph"><p>Projects completed <br> world wide</p></span>
    </div>
    <div class="card">
        <h2>120k</h2>
        <span class="card_paragraph"><p>Employees work in all <br> parts of the world</p></span>
    </div>
    </div>
</section>


    

</body>


</html>
